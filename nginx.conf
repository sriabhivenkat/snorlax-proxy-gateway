resolver 127.0.0.11 valid=10s;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

upstream oshawott {
    server oshawott_main_api:8000;  # General Flask API
}

upstream gengar {
    server gengar-postgres:5432;  # PostgreSQL container
}

upstream lucario {
    server lucario-frontend:3000;  # React frontend container
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name home.sriabhi.com nova.sriabhi.com www.sriabhi.com sriabhi.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server for home.sriabhi.com (Flask API)
server {
    listen 443 ssl;
    server_name home.sriabhi.com;

    ssl_certificate /etc/letsencrypt/live/home.sriabhi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.sriabhi.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
        style-src 'self' 'unsafe-inline';
        img-src 'self' https://home.sriabhi.com data:;
        font-src 'self' data:;
        connect-src 'self';
        frame-src 'none';
        object-src 'none';
    " always;
    add_header Referrer-Policy "no-referrer";

    client_max_body_size 500M;  # allow uploads up to 500 MB

    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://oshawott;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* /api/exchange_public_token {
        deny all;
    }
}

# HTTPS server for nova.sriabhi.com (Nova Brain API)
server {
    listen 443 ssl;
    server_name nova.sriabhi.com;

    ssl_certificate /etc/letsencrypt/live/nova.sriabhi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nova.sriabhi.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
        style-src 'self' 'unsafe-inline';
        img-src 'self' https://home.sriabhi.com data:;
        font-src 'self' data:;
        connect-src 'self';
        frame-src 'none';
        object-src 'none';
    " always;
    add_header Referrer-Policy "no-referrer";

    client_max_body_size 500M;

    location / {
        proxy_pass http://172.22.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# HTTPS server for www.sriabhi.com / sriabhi.com (React frontend)
server {
    listen 443 ssl;
    server_name www.sriabhi.com sriabhi.com;

    ssl_certificate /etc/letsencrypt/live/www.sriabhi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.sriabhi.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' https://cdn.plaid.com 'unsafe-inline' 'unsafe-eval' blob:;
        style-src 'self' 'unsafe-inline';
        img-src 'self' 
            https://raw.githubusercontent.com 
            https://home.sriabhi.com 
            https://img.pokemondb.net 
            https://github.com 
            https://m.media-amazon.com 
            https://upload.wikimedia.org 
            https://i.scdn.co 
            https://f4.bcbits.com 
            https://a.ltrbxd.com 
            https://i.ebayimg.com 
            https://ourculturemag.com 
            https://encrypted-tbn0.gstatic.com
            https://images.weserv.nl
            https://i.discogs.com
            https://plaid-merchant-logos.plaid.com
            data: blob:;
        font-src 'self' data:;
        connect-src 'self' https://home.sriabhi.com https://cdn.plaid.com https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com https://www.strava.com;
        frame-src https://cdn.plaid.com;
        object-src 'none';
    " always;
    add_header Referrer-Policy "no-referrer";

    location / {
        proxy_pass http://lucario;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    client_max_body_size 500M;

    # LetsEncrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

}
